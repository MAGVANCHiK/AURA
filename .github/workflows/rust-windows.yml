name: Rust Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release --verbose
      working-directory: ./db_formatter_rust
    - name: Run tests
      run: cargo test --verbose
      working-directory: ./db_formatter_rust
    - name: Upload binary artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: db-formatter-windows
        path: db_formatter_rust/target/release/db_formatter_rust.exe
