CREATE TABLE aura.sources_info
(
    `source_id` LowCardinality(String),
    `name` String,
    `description` String,
    `leak_date` Date DEFAULT 0,
    `record_count` UInt64,
    `schema_mapping` String
)
ENGINE = MergeTree
PRIMARY KEY source_id
ORDER BY source_id
SETTINGS index_granularity = 8192


CREATE TABLE aura.records
(
    `phone` UInt64 DEFAULT 0,
    `email` String DEFAULT '',
    `username` String DEFAULT '',
    `surname` String DEFAULT '',
    `name` String DEFAULT '',
    `patronymic` String DEFAULT '',
    `birth_day` UInt8 DEFAULT 0,
    `birth_month` UInt8 DEFAULT 0,
    `birth_year` UInt16 DEFAULT 0,
    `passport` String DEFAULT '',
    `inn` String DEFAULT '',
    `snils` String DEFAULT '',
    `car_number` String DEFAULT '',
    `telegram_id` Int64 DEFAULT 0,
    `source_id` LowCardinality(String),
    `extra` String DEFAULT ''
)
ENGINE = MergeTree
PRIMARY KEY (phone, email, username, passport, surname, name, patronymic, birth_year, birth_month, birth_day, car_number)
ORDER BY (phone, email, username, passport, surname, name, patronymic, birth_year, birth_month, birth_day, car_number)
SETTINGS index_granularity = 8192
