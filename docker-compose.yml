services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: aura-clickhouse
    ports:
      - "8123:8123" # HTTP API (для веб-интерфейсов и простых клиентов)
      - "9000:9000" # Native TCP (для Rust / C++ драйверов)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      # Прокидываем папки, чтобы данные не пропали при перезапуске
      - ./ch_data:/var/lib/clickhouse/
      - ./ch_logs:/var/log/clickhouse-server/
    restart: unless-stopped
